# /etc/php/8.3/fpm/pool.d/tpan-a_example_com_7653e4.conf
# quyền 644, chủ root:root, 2137 byte

; # Do tpan quản lý. Sửa tay sẽ bị tpan health báo lệch.
;
; Pool PHP-FPM riêng của site a.example.com. File theo cú pháp INI của PHP: chú
; thích bắt đầu bằng dấu chấm phẩy, không dùng dấu # (PHP 7.0 đã bỏ).
[tpan-a_example_com_7653e4]

; PHP của site chạy dưới user riêng, không thuộc nhóm www-data, nên không đọc
; được file của site khác (mục 5, "Cô lập từng site").
user = tp_a_example_com_7653e4
group = tp_a_example_com_7653e4

; Web server (www-data) nói chuyện với pool qua socket này. Chỉ www-data đọc
; ghi được socket, user của site khác thì không.
listen = /run/php/tpan-a_example_com_7653e4-8.3.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; ondemand: site không có khách thì không có tiến trình nào, không tốn RAM.
; Tối đa 5 tiến trình; rảnh 10 giây thì thoát; mỗi tiến trình phục vụ 500
; request rồi thay mới, để rò rỉ bộ nhớ của plugin không tích luỹ mãi.
pm = ondemand
pm.max_children = 5
pm.process_idle_timeout = 10s
pm.max_requests = 500

; PHP chỉ mở được file trong thư mục của site. Dấu / ở cuối là bắt buộc: thiếu
; nó thì /var/www/a.example.com còn khớp cả một thư mục khác bắt đầu bằng cùng tên.
php_admin_value[open_basedir] = /var/www/a.example.com/

; Upload tạm, session và file tạm nằm trong tmp/ riêng (0700), không ở /tmp
; chung nơi site khác đọc được.
php_admin_value[upload_tmp_dir] = /var/www/a.example.com/tmp
php_admin_value[session.save_path] = /var/www/a.example.com/tmp
php_admin_value[sys_temp_dir] = /var/www/a.example.com/tmp

; Giới hạn upload 64 MB, khớp client_max_body_size / LimitRequestBody của vhost.
; Mặc định của PHP là 2 MB và 8 MB, nhỏ hơn nhiều.
php_admin_value[upload_max_filesize] = 64M
php_admin_value[post_max_size] = 64M

; Lỗi PHP ghi vào log riêng của site, không lẫn với site khác.
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/tpan/sites/a.example.com/php-error.log
