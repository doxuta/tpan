# Bản thử M19 đợt 0 (t5): bố cục cổng 443 của mục 3.4 cho Apache, rút gọn (không PHP).
# Chứng chỉ thử tự ký có SAN example.com, www.example.com, xn--vitnam-jk8b.example.net;
# uncovered.example.net cố ý KHÔNG có trong chứng chỉ.

# Vhost mặc định 443 (thay cho 000-tpan-default-ssl.conf mà Plan SSL ghi): tên lạ bị từ chối.
<VirtualHost *:443>
    ServerName t5-default.invalid
    SSLEngine on
    SSLCertificateFile "/root/t5/cert.pem"
    SSLCertificateKeyFile "/root/t5/key.pem"
    <Location "/">
        Require all denied
    </Location>
</VirtualHost>

# Khối nội dung 443: tên chính + tên phụ serve CÓ trong chứng chỉ.
<VirtualHost *:443>
    ServerName example.com
    ServerAlias xn--vitnam-jk8b.example.net
    DocumentRoot "/var/www/example.com/public"
    SSLEngine on
    SSLCertificateFile "/root/t5/cert.pem"
    SSLCertificateKeyFile "/root/t5/key.pem"
    <Directory "/var/www/example.com/public">
        Options SymLinksIfOwnerMatch
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>

# Tên phụ redirect CÓ trong chứng chỉ, cổng 443.
<VirtualHost *:443>
    ServerName www.example.com
    DocumentRoot "/var/www/example.com/public"
    SSLEngine on
    SSLCertificateFile "/root/t5/cert.pem"
    SSLCertificateKeyFile "/root/t5/key.pem"
    <Directory "/var/www/example.com">
        Options SymLinksIfOwnerMatch
        AllowOverride None
    </Directory>
    RewriteEngine On
    RewriteRule ^/(.*)$ https://example.com/$1 [R=301,L]
</VirtualHost>

# Cổng 80: tên phụ serve CÓ trong chứng chỉ, khối riêng, đích https chính tên đó.
<VirtualHost *:80>
    ServerName xn--vitnam-jk8b.example.net
    DocumentRoot "/var/www/example.com/public"
    Alias /.well-known/acme-challenge/ "/var/lib/tpan/acme/.well-known/acme-challenge/"
    <Directory "/var/lib/tpan/acme/.well-known/acme-challenge">
        Options None
        AllowOverride None
        Require all granted
    </Directory>
    <Directory "/var/www/example.com">
        Options SymLinksIfOwnerMatch
        AllowOverride None
    </Directory>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^/(.*)$ https://xn--vitnam-jk8b.example.net/$1 [R=301,L]
</VirtualHost>

# Cổng 80: tên phụ redirect + tên phụ serve CHƯA có trong chứng chỉ, đích https tên chính.
<VirtualHost *:80>
    ServerName www.example.com
    ServerAlias uncovered.example.net
    DocumentRoot "/var/www/example.com/public"
    Alias /.well-known/acme-challenge/ "/var/lib/tpan/acme/.well-known/acme-challenge/"
    <Directory "/var/lib/tpan/acme/.well-known/acme-challenge">
        Options None
        AllowOverride None
        Require all granted
    </Directory>
    <Directory "/var/www/example.com">
        Options SymLinksIfOwnerMatch
        AllowOverride None
    </Directory>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^/(.*)$ https://example.com/$1 [R=301,L]
</VirtualHost>
