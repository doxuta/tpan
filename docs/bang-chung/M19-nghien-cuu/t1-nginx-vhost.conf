# Do tpan quản lý. Bản thử M19 đợt 0 (t1): vhost example.com cổng 80 theo thiết kế M19.
# Khối 1: tên chính + tên phụ "phục vụ"; luật chuyển hướng theo đường dẫn là location khớp đúng (=).
server {
    listen 80;
    listen [::]:80;
    server_name example.com xn--vitnam-jk8b.example.net;

    root /var/www/example.com/public;
    disable_symlinks if_not_owner;
    index index.php;
    access_log /var/log/tpan/sites/example.com/access.log;
    error_log /var/log/tpan/sites/example.com/error.log;
    client_max_body_size 64m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/tpan/acme;
    }

    # Chuyển hướng theo đường dẫn (M19): khớp đúng nguyên đường dẫn đã giải mã.
    location = /old-page {
        return 301 /new-page;
    }
    location = /keepq {
        return 301 https://example.net/target$is_args$args;
    }
    location = /dropq {
        return 302 https://example.net/target;
    }
    location = /wp-content/uploads/evil2.php {
        return 301 /moved;
    }

    location ~ /\.(?!well-known/) {
        deny all;
    }
    location ~* ^/wp-content/uploads/.*\.php$ {
        deny all;
    }
    location / {
        try_files $uri $uri/ /index.php?$args;
    }
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/tpan-example_com_a379a6-8.3.sock;
    }
}

# Khối 2: tên phụ "chuyển về tên chính". Thử thách ACME vẫn phục vụ thẳng.
server {
    listen 80;
    listen [::]:80;
    server_name www.example.com;

    access_log /var/log/tpan/sites/example.com/access.log;
    error_log /var/log/tpan/sites/example.com/error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/tpan/acme;
    }
    location / {
        return 301 http://example.com$request_uri;
    }
}

# Khối 3 (chỉ để đo $host): giống khối :80 của bản SSL, chuyển sang https theo $host.
server {
    listen 80;
    listen [::]:80;
    server_name hostprobe.example.com;
    location / {
        return 301 https://$host$request_uri;
    }
}
