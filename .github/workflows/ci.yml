name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build giao diện
        run: make web

      - name: go vet
        run: go vet ./...

      - name: Unit test
        run: go test ./...

      # Logic thuần của giao diện (web/src/**/*.test.ts), chạy thẳng bằng Node
      # (Node 22 từ bản 22.18 tự bỏ phần kiểu của TypeScript).
      - name: Test giao diện
        run: make test-web

      - name: Build file chạy cho Linux
        run: make build-linux
